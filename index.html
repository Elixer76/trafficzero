<title>Zero Cost Traffic</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;700&display=swap">
<style>
/* Layout: one centered column, logo over banner over button, vertically centered on a dark ground with a yellow glow behind the logo */
:root {
  --bg: #0b0b0b;
  --bg-glow: #2a2600;
  --fg: #f4f4f0;
  --muted: #b9b9b0;
  --yellow: #ffee00;
  --red: #e4181b;
  --display: "Anton", Impact, "Arial Narrow", sans-serif;
  --body: "Archivo", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  background-image: radial-gradient(ellipse 60% 45% at 50% 38%, var(--bg-glow), transparent 70%);
  color: var(--fg);
  font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px;
}
.stage {
  min-height: calc(100vh - 64px);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 22px; text-align: center; margin: 0 auto; max-width: 560px;
}
.logo { display: block; width: 300px; max-width: 100%; height: auto; border: 3px solid var(--yellow); }
.lede { margin: 0; max-width: 34ch; font-size: 1.05rem; line-height: 1.45; color: var(--muted); text-wrap: balance; }
.banner { display: block; line-height: 0; max-width: 100%; }
.banner img { width: 468px; max-width: 100%; height: auto; border: 1px solid #000; box-shadow: 0 6px 24px rgba(0,0,0,.6); }
.cta {
  display: inline-block; background: var(--yellow); color: #000; text-decoration: none;
  font-family: var(--display); font-size: clamp(1.4rem, 6vw, 1.9rem); letter-spacing: .03em; text-transform: uppercase;
  padding: 16px 30px; border-bottom: 5px solid var(--red); max-width: 100%;
  transition: transform .15s ease, background .15s ease;
}
.cta:hover { transform: translateY(-2px); background: #fff35c; }
.cta:focus-visible, .banner:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
.fine { margin: 0; font-size: .8rem; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .cta { transition: none; } .cta:hover { transform: none; } }
</style>
